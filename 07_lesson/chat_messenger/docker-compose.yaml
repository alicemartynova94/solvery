services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  messenger:
    build: .
    environment:
      APP_ENV: local
    depends_on:
      - db
    ports:
      - "8080:8080"
      - "8090:8090"
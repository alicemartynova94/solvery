syntax = "proto3";

package api;

option go_package = "solvery/07_lesson/chat_messenger/pkg/messenger/v1;messenger";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service MessengerService{
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);

  rpc CreateChat(CreateChatRequest) returns (Chat);

  rpc GetChat(GetChatRequest) returns (Chat);

  rpc UpdateChat(UpdateChatRequest) returns (Chat);

  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);

  rpc AddChatMembers(AddChatMembersRequest) returns (AddChatMembersResponse);

  rpc DeleteChatMember(DeleteChatMemberRequest) returns (DeleteChatMemberResponse);

  rpc CreateMessage(CreateMessageRequest) returns (Message);

  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);

  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);

  rpc EditMessage(EditMessageRequest) returns (Message);
}

message Session{
  string id = 1;
}

message CreateSessionRequest{}

message CreateSessionResponse{
  Session session = 1;
}

message DeleteSessionRequest {
  Session session = 1;
}

message DeleteSessionResponse{}

message CreateChatRequest{
  string chat_name = 1;
  optional google.protobuf.Timestamp expires_at = 2;
  bool read_only = 3;
  int32 max_messages = 4;
  repeated string members = 5;
}

message Chat{
  string id = 1;
  string chat_name = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool read_only = 4;
  int32 max_messages = 5;
  repeated string members = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp deleted_at = 9;
}

message GetChatRequest{
  string chat_id = 1;
}

message UpdateChatRequest{
  optional string chat_name = 1;
  optional google.protobuf.Timestamp expires_at = 2;
  optional bool read_only = 3;
  optional int32 max_messages = 4;
  bool clear_expires_at = 5;
}

message DeleteChatRequest{
  string chat_id = 1;
}

message DeleteChatResponse{}

message AddChatMembersRequest{
  string chat_id = 1;
  repeated string members = 2;
}

message AddChatMembersResponse{
  repeated string members = 1;
}

message DeleteChatMemberRequest{
  string chat_id = 1;
  string member_id = 2;
}

message DeleteChatMemberResponse{
}

message CreateMessageRequest{
  string chat_id = 1;
  string text = 2;
}

message Message {
  string id = 1;
  string author_id = 2;
  string text = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message GetMessagesRequest{
  string chat_id = 1;
}

message GetMessagesResponse{
  repeated Message messages = 1;
}

message DeleteMessageRequest{
  string chat_id = 1;
  string message_id = 2;
}

message DeleteMessageResponse{}

message EditMessageRequest{
  string chat_id = 1;
  string message_id = 2;
  string text = 3;
}
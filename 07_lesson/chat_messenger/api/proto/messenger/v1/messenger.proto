syntax = "proto3";

package api;

option go_package = "github.com/pkg/messenger;messenger";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service MessengerService{
  rpc CreateSession(CreateSessionRequest) returns (Session){
    option (google.api.http) = {
      post: "api/v1/sessions"
    };
  }

  rpc DeleteSession(Session) returns (DeleteSessionResponse){
    option (google.api.http) = {
      delete: "api/v1/sessions"
    };
  }

  rpc CreateChat(CreateChatRequest) returns (Chat){
    option (google.api.http) = {
      post: "api/v1/chats"
      body: "*"
    };
  }

  rpc GetChat(GetChatRequest) returns (Chat){
    option (google.api.http) = {
      get: "api/v1/chats/{id}"
      body: "*"
    };
  }

  rpc UpdateChat(UpdateChatRequest)returns (Chat){
    option (google.api.http) = {
      get: "api/v1/chats/{id}"
      body: "*"
    };
  }

  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse){
    option (google.api.http) = {
      get: "api/v1/chats/{id}"
      body: "*"
    };
  }

  rpc AddChatMembers(AddChatMembersRequest) returns (AddChatMembersResponse){
    option (google.api.http) = {
      post: "/chats/{chat_id}/join"
    };
  }

  rpc DeleteChatMember(DeleteChatMemberRequest) returns (DeleteChatMemberResponse){
    option (google.api.http) = {
      post: "api/v1/chats/{id}/members"
    };
  }

  rpc CreateMessage(CreateMessageRequest) returns (Message) {
    option (google.api.http) = {
      post: "api/v1/chats/{id}/messages"
      body: "*"
    };
  }

  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse) {
    option (google.api.http) = {
      get: "api/v1/chats/{id}/messages"
    };
  }

  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse){
    option(google.api.http) = {
      delete: "api/v1/chats/{id}/messages/{id}"
    };
  }

  rpc EditMessage(EditMessageRequest) returns (Message){
    option(google.api.http) = {
      patch: "api/v1/chats/{id}/messages/{id}"
    };
  }
}

message CreateSessionRequest{}

message Session{
  string id = 1;
}

message DeleteSessionResponse{}

message CreateChatRequest{
  string chat_name = 1;
  optional google.protobuf.Timestamp expires_at = 2;
  bool read_only = 3;
  int32 max_messages = 4;
  repeated Session members = 5;
}

message Chat{
  string id = 1;
  string chat_name = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool read_only = 4;
  int32 max_messages = 5;
  repeated Session members = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GetChatRequest{
  string id = 1;
}

message UpdateChatRequest{
  string chat_name = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool read_only = 4;
  int32 max_messages = 5;
}

message DeleteChatRequest{
  string id = 1;
}

message DeleteChatResponse{}

message AddChatMembersRequest{
  string id = 1;
  repeated Session members = 2;
}

message AddChatMembersResponse{
  repeated Session members = 1;
}

message DeleteChatMemberRequest{
  string id = 1;
}

message DeleteChatMemberResponse{
}

message CreateMessageRequest{
  string chat_id = 1;
  string message_text = 2;
}

message Message {
  string id = 1;
  string author_id = 2;
  string text = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetMessagesRequest{
  string chat_id = 1;
}

message GetMessagesResponse{
  repeated Message messages = 1;
}

message DeleteMessageRequest{
  string chat_id = 1;
  string message_id = 2;
}

message DeleteMessageResponse{}

message EditMessageRequest{
  string chat_id = 1;
  string message_id = 2;
}